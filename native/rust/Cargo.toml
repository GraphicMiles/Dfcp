[package]
name = "photon-core"
version = "0.1.0"
edition = "2021"
description = "Core optical screen-to-camera communication library (Photon Lab)"
license = "MIT OR Apache-2.0"
authors = ["GraphicMiles Research"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
nalgebra = "0.32"
rand = "0.8"
thiserror = "1.0"

# Android / JNI dependencies (optional, activated via feature)
jni = { version = "0.21", optional = true }
android_logger = { version = "0.13", optional = true }
log = { version = "0.4", optional = true }

[features]
default = []
android = ["jni", "android_logger", "log"]

[[bin]]
name = "photon-test"
path = "src/bin/test.rs"
required-features = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
