name: Build Photon Lab Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android Rust targets (explicit)
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          echo "Installed targets:"
          rustup target list --installed | grep -E 'android' || echo "No android targets listed (may be ok)"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build Rust core for Android
        working-directory: native/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p ../../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../android/app/src/main/jniLibs/armeabi-v7a
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../android/app/src/main/jniLibs build --release --features android
          ls -la ../../android/app/src/main/jniLibs/ || true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare and validate Gradle wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/
          ./gradlew --version || (echo "Wrapper validation failed" && ls -R gradle/)

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Debug Gradle outputs (always run)
        working-directory: android
        if: always()
        run: |
          echo "=== Searching for APKs and native libs ==="
          find . -name "*.apk" -o -name "*.so" 2>/dev/null | head -30 || true
          echo "=== Debug APK dir ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true
          echo "=== jniLibs contents ==="
          find app/src/main/jniLibs -type f 2>/dev/null | head -20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release APK (unsigned)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-lab-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
