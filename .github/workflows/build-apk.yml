name: Build Photon Lab Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Ensure Android Rust targets (robust + retry)
        run: |
          echo "=== Installing Android Rust targets ==="
          for target in aarch64-linux-android armv7-linux-androideabi; do
            rustup target install $target || rustup target add $target || echo "Warning: could not add $target"
          done
          rustup component add rust-src || true

          echo "=== Installed targets ==="
          rustup target list --installed

          if ! rustup target list --installed | grep -q aarch64-linux-android; then
            echo "FATAL: aarch64-linux-android target is missing after install"
            exit 1
          fi
          echo "Android targets OK"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build Rust core for Android (verbose)
        working-directory: native/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TERM_COLOR: never
        run: |
          mkdir -p ../../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../android/app/src/main/jniLibs/armeabi-v7a

          echo "=== Building photon-core for Android ==="
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../android/app/src/main/jniLibs \
            build --release --features android --verbose 2>&1 | tee cargo-build.log

          echo "=== jniLibs contents ==="
          ls -la ../../android/app/src/main/jniLibs/ || true
          ls -la ../../android/app/src/main/jniLibs/arm64-v8a/ || true
          ls -la ../../android/app/src/main/jniLibs/armeabi-v7a/ || true

          echo "=== HARD verification of .so files (prevents crash on install) ==="
          for abi in arm64-v8a armeabi-v7a; do
            SO="../../android/app/src/main/jniLibs/$abi/libphoton_core.so"
            if [ -f "$SO" ]; then
              echo "✓ $SO present ($(stat -c%s "$SO" 2>/dev/null || echo 'size?') bytes)"
            else
              echo "FATAL: $SO MISSING — the APK will crash after installation with UnsatisfiedLinkError"
              tail -80 cargo-build.log || true
              exit 1
            fi
          done
          echo "All native libs verified."

          echo "=== Last 30 lines of cargo build log ==="
          tail -30 cargo-build.log || true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Prepare and validate Gradle wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/
          ./gradlew --version || (echo "Wrapper validation failed" && ls -R gradle/)

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Debug Gradle outputs (always run)
        working-directory: android
        if: always()
        run: |
          echo "=== Searching for APKs and native libs ==="
          find . -name "*.apk" -o -name "*.so" 2>/dev/null | head -30 || true
          echo "=== Debug APK dir ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true
          echo "=== jniLibs contents ==="
          find app/src/main/jniLibs -type f 2>/dev/null | head -20 || true

      - name: Upload Debug APK (ONLY 1 artifact)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: photon-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Verify APK contains native libs (prevents crash after installation)
        working-directory: android
        if: always()
        run: |
          echo "=== FINAL VERIFICATION ==="
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "✓ APK produced"
            ls -lh "$APK"
            echo ""
            echo "=== .so files INSIDE the APK (this is why the app was crashing) ==="
            if unzip -l "$APK" | grep -E 'lib.*photon_core\.so'; then
              echo "✓ SUCCESS: libphoton_core.so packaged inside APK"
              echo "App will no longer crash on System.loadLibrary after installation."
            else
              echo "!! CRITICAL: libphoton_core.so is NOT inside the APK"
              echo "This is the root cause of 'The app is crashing after installation'"
            fi
            echo ""
            echo "=== Only 1 artifact uploaded (photon-lab-debug-apk) ==="
          else
            echo "APK not found"
            exit 1
          fi
